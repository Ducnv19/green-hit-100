// Nhạc nền chiptune: bus riêng (mg) nhỏ hơn hiệu ứng, nên không át tiếng SFX
const MEL=[76,79,76,72,74,76,74,0,72,76,79,76,72,74,76,0,77,81,77,72,76,79,76,72,74,77,76,74,72,76,79,0],BAS=[48,43,48,43,48,43,48,43,53,48,53,48,55,50,55,43];
let mg,mi,mst=0,mnx=0;const mf=m=>440*Math.pow(2,(m-69)/12);
function note(f,t,d,ty,v){const o=ac.createOscillator(),a=ac.createGain();o.type=ty;o.frequency.value=f;a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a);a.connect(mg);o.start(t);o.stop(t+d)}

function fit(){const f=$('fit'),cs=getComputedStyle(f),pl=parseFloat(cs.paddingLeft)||0,pt=parseFloat(cs.paddingTop)||0,aw=f.clientWidth-pl-(parseFloat(cs.paddingRight)||0),ah=f.clientHeight-pt-(parseFloat(cs.paddingBottom)||0),sc=Math.max(.2,Math.min(aw/W,ah/H));
$('w').style.transform=`translate(${pl+(aw-W*sc)/2}px,${pt+(ah-H*sc)/2}px) scale(${sc})`;const k=Math.min(3,Math.max(1,sc*(devicePixelRatio||1)));if(cv.width!==Math.round(W*k)){cv.width=Math.round(W*k);cv.height=Math.round(H*k)}}

document.addEventListener('click',()=>{startMusic();if(!TOUCH||document.fullscreenElement)return;try{const e=document.documentElement;Promise.resolve((e.requestFullscreen||e.webkitRequestFullscreen).call(e)).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{})}catch(x){}});

addEventListener('keydown',e=>{startMusic();if(e.target.tagName==='INPUT')return;if(S==='MENU'&&e.code==='Enter'&&!ov.innerHTML){nameView();return}if(S==='RULES'&&e.code==='Escape'){menu();return}if(pause)return;if(e.code==='Space'&&(S==='AIM'||S==='ANG')){e.preventDefault();lock()}else if(S==='QUIZ'){const i='abcd'.indexOf(e.key.toLowerCase());const n=+e.key-1;if(i>=0)answer(i);else if(n>=0&&n<4)answer(n)}});

if(ball&&!ball.hit){let x,y,r;if(ball.k){x=ball.k.x;y=ball.k.y;r=ot*9}else if(ball.b>0){const b=ball.b;x=ball.lx+Math.sign(ball.vx)*90*b;y=455-4*50*b*(1-b);r=12+b*5}else{x=ball.x;y=ball.y;r=ball.t*10}it(item,x,y,r)}
